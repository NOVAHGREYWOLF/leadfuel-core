"_241\":240,\"_242\":67,\"_66\":67,\"_243\":34,\"_244\":200,\"_245\":10},\"recipient\",\"all\",\"channel\",\"final\",\"finish_details\",{\"_50\":246,\"_247\":248},\"is_complete\",\"citations\",[],\"content_references\",[],\"story_events\",[],\"resolved_model_slug\",\"search_result_groups\",[],\"cot_version\",\"v5\",\"conversation_followup_suggestions_eligible\",\"request_id\",\"af078be4-4337-4f3b-af95-1d59a13ccdf9\",\"message_type\",\"next\",\"turn_exchange_id\",\"0f8c025d-4383-4a30-85ee-1ab26d8ac6eb\",\"working_turn_id\",\"model_slug\",\"can_save\",\"parent_id\",\"shared_conversation_id\",\"stop\",\"stop_tokens\",[249],200002,\"content_type\",\"text\",\"parts\",[254],\"Done. I structured it as a **10-phase check-off timeline**, followed by a suggested six-release rhythm and a reusable master checklist for each new drawing.\\n\\n[Download the editable Drawing Content Release Timeline](sandbox:/mnt/data/Orion_Fredericks_Drawing_Content_Release_Timeline.docx)\\n\\nI kept it sequential rather than date-bound, so we can adjust the cadence once we see how much finished drawing footage you have.\",\"role\",\"assistant\",{},{\"_196\":200,\"_203\":261,\"_54\":262,\"_56\":263,\"_207\":264,\"_209\":210,\"_212\":213,\"_214\":265,\"_216\":217,\"_218\":266},\"f1903419-4e72-423a-8802-ae4df4206846\",[81],{\"_255\":316,\"_301\":317,\"_214\":318},1790544865.0611367,1790544865.741751,{\"_250\":315,\"_251\":303},{\"_222\":34,\"_267\":268,\"_229\":67,\"_232\":233,\"_235\":236,\"_237\":238,\"_239\":240,\"_241\":240,\"_242\":67,\"_66\":67,\"_244\":259,\"_245\":10,\"_243\":14},\"commentary\",\"aggregate_result\",{\"_209\":269,\"_270\":271,\"_272\":262,\"_56\":263,\"_273\":274,\"_275\":263,\"_276\":-5,\"_277\":-5,\"_278\":-5,\"_279\":280,\"_281\":282,\"_283\":-5},\"success\",\"run_id\",\"00b58814-ebff-4446-8fea-5df13684eaa6\",\"start_time\",\"code\",\"from docx import Document\\nfrom docx.shared import Inches, Pt\\nfrom docx.enum.text import WD_ALIGN_PARAGRAPH\\nfrom docx.enum.table import WD_TABLE_ALIGNMENT, WD_CELL_VERTICAL_ALIGNMENT\\nfrom docx.oxml import OxmlElement\\nfrom docx.oxml.ns import qn\\n\\nout=\\\"/mnt/data/Orion_Fredericks_Drawing_Content_Release_Timeline.docx\\\"\\ndoc=Document()\\ns=doc.sections[0]\\ns.top_margin=Inches(.6); s.bottom_margin=Inches(.6); s.left_margin=Inches(.7); s.right_margin=Inches(.7)\\n\\nfor st in [\\\"Normal\\\",\\\"Title\\\",\\\"Heading 1\\\",\\\"Heading 2\\\"]:\\n    doc.styles[st].font.name=\\\"Arial\\\"\\ndoc.styles[\\\"Normal\\\"].font.size=Pt(10)\\ndoc.styles[\\\"Title\\\"].font.size=Pt(20)\\ndoc.styles[\\\"Heading 1\\\"].font.size=Pt(14)\\ndoc.styles[\\\"Heading 2\\\"].font.size=Pt(11)\\n\\nt=doc.add_paragraph(style=\\\"Title\\\"); t.alignment=WD_ALIGN_PARAGRAPH.CENTER\\nt.add_run(\\\"Orion Fredericks\\\\nDrawing Content Release Timeline\\\")\\np=doc.add_paragraph(); p.alignment=WD_ALIGN_PARAGRAPH.CENTER\\np.add_run(\\\"A check-off workflow for using drawing and timelapse content to introduce the current practice\\\").italic=True\\n\\ndoc.add_paragraph(\\n    \\\"Primary category: ORION - NOW. Secondary category: ORION - ARTIST. \\\"\\n    \\\"The objective is to use drawing as the present-tense doorway into the larger sculptural, technical, \\\"\\n    \\\"and historical body of work—not to present the footage as generic timelapse content.\\\"\\n)\\n\\ndef checkbox(text, bold=False):\\n    p=doc.add_paragraph()\\n    p.paragraph_format.space_after=Pt(3)\\n    r=p.add_run(\\\"☐  \\\"+text)\\n    r.bold=bold\\n    return p\\n\\nphases=[\\n(\\\"PHASE 1 — Build the Master Drawing Package\\\",\\n \\\"Before publishing anything. Complete this once for each drawing/session.\\\",\\n [\\n \\\"Select one drawing session to serve as the first release.\\\",\\n \\\"Identify the finished drawing/title or assign a working title.\\\",\\n \\\"Write 1–3 sentences explaining what you were exploring in the drawing.\\\",\\n \\\"Identify any relationship to sculpture, form, light, fire, water, kinetics, space, or other recurring ideas in the larger practice.\\\",\\n \\\"Select the strongest finished image of the drawing.\\\",\\n \\\"Select 3–6 detail images/crops.\\\",\\n \\\"Select one image or frame that shows you with the work.\\\",\\n \\\"Review the full drawing video/timelapse and identify the strongest visual moments.\\\",\\n \\\"Confirm music, footage, photography, and other media are cleared for publication.\\\",\\n ]),\\n(\\\"PHASE 2 — Create the Core Video Assets\\\",\\n \\\"One source session becomes several assets. Do not create unrelated content for each platform.\\\",\\n [\\n \\\"Create a 2–5 minute horizontal hero/process film.\\\",\\n \\\"Create a 30–90 second vertical timelapse.\\\",\\n \\\"Create 2–4 short vertical process clips (approximately 10–30 seconds each).\\\",\\n \\\"Export a clean still/frame suitable for a thumbnail.\\\",\\n \\\"Keep a clean master without platform-specific text for future reuse.\\\",\\n \\\"Create captions/subtitles where spoken material is used.\\\",\\n ]),\\n(\\\"PHASE 3 — Establish the Permanent Homes\\\",\\n \\\"Build the durable archive before relying on short-lived social posts.\\\",\\n [\\n \\\"Create or prepare a Drawing section on orionfredericks.studio.\\\",\\n \\\"Create or prepare a Process section for studio, drawing, fabrication, testing, and prototyping.\\\",\\n \\\"Add the finished drawing as artwork—not only as a video thumbnail.\\\",\\n \\\"Embed or link the hero process film with the drawing where appropriate.\\\",\\n \\\"Use YouTube as the canonical home for the full moving-image version.\\\",\\n \\\"Choose a repeatable YouTube series naming convention (e.g., Drawing Study / Studio Study / Drawing the Numinous).\\\",\\n \\\"Write a YouTube description that connects the drawing to the broader sculptural practice.\\\",\\n ]),\\n(\\\"PHASE 4 — Release 1: Present-Tense Introduction\\\",\\n \\\"Lead with what you are doing now.\\\",\\n [\\n \\\"Publish the first hero/process film to YouTube.\\\",\\n \\\"Publish the finished drawing and/or process material on the website.\\\",\\n \\\"Publish a short-form timelapse to the most relevant social channels.\\\",\\n \\\"Use a caption that explains why drawing is part of the current practice.\\\",\\n \\\"Include a clear path back to the website or full video where appropriate.\\\",\\n \\\"Record the published URLs in the digital-footprint inventory.\\\",\\n ]),\\n(\\\"PHASE 5 — Release 2: Reinforce the Drawing Practice\\\",\\n \\\"Show that the first post was not an isolated experiment.\\\",\\n [\\n \\\"Release a second drawing or another segment from the drawing process.\\\",\\n \\\"Show the finished artwork clearly.\\\",\\n \\\"Publish one detail/process clip rather than repeating the exact first edit.\\\",\\n \\\"Add a short observation about form, gesture, material, space, or another idea being explored.\\\",\\n \\\"Update the website Drawing/Process archive.\\\",\\n ]),\\n(\\\"PHASE 6 — Reveal the Studio / Maker Behind the Drawings\\\",\\n \\\"Begin widening the frame from drawing to the larger practice.\\\",\\n [\\n \\\"Release studio/process footage that shows the environment where the work develops.\\\",\\n \\\"Include tools, models, materials, sketches, fabrication or works-in-progress where useful.\\\",\\n \\\"Connect drawing to design/fabrication rather than presenting the two as separate identities.\\\",\\n \\\"Add a concise current-practice statement to the website if one is not already present.\\\",\\n ]),\\n(\\\"PHASE 7 — Make the First Historical Connection\\\",\\n \\\"Use the new material to reopen the archive without turning the feed into nostalgia.\\\",\\n [\\n \\\"Choose one drawing/form that has a genuine visual or conceptual relationship to an earlier sculpture.\\\",\\n \\\"Select the strongest archival sculpture images/video.\\\",\\n \\\"Explain the connection between the current drawing and the earlier work.\\\",\\n \\\"Publish the historical work as evidence of continuity in the practice.\\\",\\n \\\"Update that project's website record while attention is on it.\\\",\\n ]),\\n(\\\"PHASE 8 — Introduce a Major Archival Work\\\",\\n \\\"Begin rebuilding the public understanding of the larger career.\\\",\\n [\\n \\\"Choose one priority work (for example: Gilly, Fata Morgana, Portal, Divinatrix, Le Attrata, or another appropriate project).\\\",\\n \\\"Confirm authorship, your role, date, collaborators, dimensions, materials, location/status, and media rights.\\\",\\n \\\"Assemble hero image, details, process documentation, and video.\\\",\\n \\\"Write/update the definitive project page.\\\",\\n \\\"Release one short-form piece that points back to the deeper project record.\\\",\\n ]),\\n(\\\"PHASE 9 — Return to the Present\\\",\\n \\\"Avoid letting the archive overwhelm the current identity.\\\",\\n [\\n \\\"Release another drawing/process piece.\\\",\\n \\\"Show current Numinous Designs or studio activity where appropriate.\\\",\\n \\\"Introduce a current sculpture, commission, prototype, or work in development.\\\",\\n \\\"Make clear what kinds of projects/commissions/collaborations you are interested in now.\\\",\\n ]),\\n(\\\"PHASE 10 — Audit the First Release Cycle\\\",\\n \\\"Review what the new content has changed before scaling up.\\\",\\n [\\n \\\"Check website navigation and confirm Drawing / Process / Sculpture relationships are clear.\\\",\\n \\\"Review YouTube titles, thumbnails, descriptions, and playlists for consistency.\\\",\\n \\\"Review Facebook/social profiles and pinned/featured content.\\\",\\n \\\"Search 'Orion Fredericks' and note what new pages/videos are appearing.\\\",\\n \\\"Update the Digital Footprint Matrix: Website / YouTube / Facebook / press / third-party coverage.\\\",\\n \\\"Mark each priority project: AMPLIFY / BUILD / UPDATE / ARCHIVE.\\\",\\n \\\"Choose the next 3–5 projects/content packages based on the audit.\\\",\\n ])\\n]\\n\\nfor title, desc, items in phases:\\n    doc.add_heading(title, level=1)\\n    doc.add_paragraph(desc)\\n    for x in items: checkbox(x)\\n\\ndoc.add_page_break()\\ndoc.add_heading(\\\"Suggested First Release Rhythm\\\", level=1)\\ntbl=doc.add_table(rows=1, cols=4); tbl.style=\\\"Table Grid\\\"; tbl.alignment=WD_TABLE_ALIGNMENT.CENTER\\nheaders=[\\\"Release\\\",\\\"Lead Content\\\",\\\"Supporting Content\\\",\\\"Narrative Job\\\"]\\nfor i,h in enumerate(headers):\\n    tbl.rows[0].cells[i].text=h\\n    for r in tbl.rows[0].cells[i].paragraphs[0].runs:r.bold=True\\ndata=[\\n(\\\"1\\\",\\\"Drawing process / hero film\\\",\\\"Finished drawing + short timelapse\\\",\\\"Here is what I am making now.\\\"),\\n(\\\"2\\\",\\\"Second drawing\\\",\\\"Detail/process clip\\\",\\\"This is an active part of the practice.\\\"),\\n(\\\"3\\\",\\\"Studio/process\\\",\\\"Tools, materials, work environment\\\",\\\"Here is how the larger practice is built.\\\"),\\n(\\\"4\\\",\\\"Drawing → earlier sculpture\\\",\\\"Current + archival imagery\\\",\\\"These forms belong to a continuous visual language.\\\"),\\n(\\\"5\\\",\\\"Major archival work\\\",\\\"Project page + video/stills\\\",\\\"Here is the scale and history behind the current work.\\\"),\\n(\\\"6\\\",\\\"Current drawing / Numinous work\\\",\\\"Process + present project\\\",\\\"The practice is active and moving forward.\\\"),\\n]\\nfor row in data:\\n    c=tbl.add_row().cells\\n    for i,v in enumerate(row): c[i].text=v\\n\\ndoc.add_heading(\\\"Master Package Checklist — Repeat for Each Drawing\\\", level=1)\\nfor x in [\\n\\\"☐ Working/final title\\\",\\n\\\"☐ Finished high-resolution image\\\",\\n\\\"☐ 3–6 detail images\\\",\\n\\\"☐ Image/frame showing Orion with the work\\\",\\n\\\"☐ 2–5 minute horizontal process film\\\",\\n\\\"☐ 30–90 second vertical timelapse\\\",\\n\\\"☐ 2–4 short process clips\\\",\\n\\\"☐ Thumbnail/cover image\\\",\\n\\\"☐ 50–150 word statement\\\",\\n\\\"☐ Website entry\\\",\\n\\\"☐ YouTube upload\\\",\\n\\\"☐ Short-form/social release\\\",\\n\\\"☐ Media rights/credits confirmed\\\",\\n\\\"☐ URLs added to footprint inven :217},\"b34a6764-4eae-4b2e-b897-07d3c6005f66\",[355],{\"_255\":377,\"_214\":390},1790544834.427624,{\"_250\":251,\"_252\":389},{\"_386\":387,\"_375\":34,\"_388\":14,\"_229\":67,\"_232\":233,\"_235\":236,\"_237\":238,\"_239\":240,\"_241\":240,\"_242\":67,\"_66\":67,\"_244\":380,\"_245\":10,\"_243\":14},\"exclusive_key\",\"files_source_fidelity\",\"rebase_developer_message\",[365],{},{\"_196\":380,\"_203\":394,\"_54\":395,\"_207\":396,\"_209\":210,\"_212\":213,\"_214\":397,\"_216\":217},\"610dbd18-6d29-4e3a-aa7d-23af2aa21b05\",[368],{\"_255\":377,\"_214\":399},1790544832.9574363,{\"_250\":251,\"_252\":398},{\"_375\":34,\"_229\":67,\"_232\":233,\"_235\":236,\"_237\":238,\"_239\":240,\"_241\":240,\"_242\":67,\"_66\":67,\"_244\":392,\"_245\":10,\"_243\":14},[365],{},{\"_196\":392,\"_203\":403,\"_54\":404,\"_56\":405,\"_207\":406,\"_209\":210,\"_212\":213,\"_214\":407,\"_216\":217},\"10abd8b3-68f3-45f2-b879-fd8d703e17ba\",[380],{\"_255\":411,\"_214\":412},1790544832.653,1790544871.686869,{\"_250\":251,\"_252\":409},{\"_235\":236,\"_408\":-5,\"_239\":240,\"_241\":240,\"_245\":10,\"_243\":14},\"message_source\",[410],\"yes please export this as a timeline i can follow and check off boxes.\",\"user\",{},{\"_196\":401,\"_203\":416,\"_54\":417,\"_56\":418,\"_207\":419,\"_209\":210,\"_211\":34,\"_212\":213,\"_214\":420,\"_216\":217,\"_218\":219},\"4e1a764b-bd38-481f-8bc1-4f80612be4e9\",[392],{\"_255\":256,\"_214\":479},1790544738.973648,1790544759.12472,{\"_250\":251,\"_252\":477},{\"_220\":421,\"_222\":34,\"_223\":422,\"_225\":423,\"_227\":424,\"_229\":67,\"_230\":425,\"_232\":233,\"_234\":34,\"_235\":426,\"_237\":238,\"_239\":427,\"_241\":427,\"_242\":67,\"_66\":67,\"_243\":34,\"_244\":414,\"_245\":10},{\"_50\":246,\"_247\":476},[],[428,429,430],[],[],\"4b2f5227-fae8-4839-9702-13e48b201ff3\",\"6e477652-e6af-4568-bc45-bcc71b0a5c4c\",{\"_431\":465,\"_433\":-5,\"_434\":466,\"_436\":467,\"_62\":468,\"_439\":469,\"_47\":470,\"_441\":470,\"_50\":41,\"_53\":471,\"_451\":472,\"_453\":-5,\"_454\":-5},{\"_431\":444,\"_433\":-5,\"_434\":445,\"_436\":446,\"_62\":447,\"_439\":448,\"_47\":449,\"_441\":449,\"_50\":41,\"_53\":450,\"_451\":452,\"_453\":-5,\"_454\":-5},{\"_431\":432,\"_433\":-5,\"_434\":435,\"_436\":437,\"_62\":438,\"_439\":440,\"_47\":-5,\"_441\":-5,\"_50\":442,\"_443\":14},\"matched_text\",\"memcite\",\"prefix\",\"start_idx\",5188,\"end_idx\",5197,[],\"refs\",[],\"prompt_text\",\"hidden\",\"invalid\",\"urlThe Art of Orion Frederickshttps://www.facebook.com/TheArtofOrionFredericks/\",3332,3415,[],[],\"[The Art of Orion Fredericks](https://www.facebook.com/TheArtofOrionFredericks/?utm_source=chatgpt.com)\",\"The Art of Orion Fredericks\",\"item\",{\"_53\":450,\"_41\":455,\"_456\":457,\"_458\":-5,\"_459\":-5,\"_460\":-5,\"_461\":-5,\"_439\":462,\"_463\":-5,\"_464\":-5},\"layout\",\"logo\",\"https://www.facebook.com/TheArtofOrionFredericks/?utm_source=chatgpt.com\",\"attribution\",\"facebook.com\",\"pub_date\",\"snippet\",\"attribution_segments\",\"supporting_websites\",[],\"hue\",\"attributions\",\"urlOrion Fredericks on YouTubehttps://www.youtube.com/@OrionFredericks\",2398,2472,[],[],\"[Orion Fredericks on YouTube](https://www.youtube.com/@OrionFredericks?utm_source=chatgpt.com)\",\"Orion Fredericks on YouTube\",{\"_53\":471,\"_41\":473,\"_456\":474,\"_458\":-5,\"_459\":-5,\"_460\":-5,\"_461\":-5,\"_439\":475,\"_463\":-5,\"_464\":-5},\"https://www.youtube.com/@OrionFredericks?utm_source=chatgpt.com\",\"youtube.com\",[],[249],[478],\"I think the drawing material can solve an important problem in the footprint: it can **introduce the present-day Orion before you begin releasing the heavier historical archive**.\\n\\nI would categorize it primarily as **ORION — NOW**, secondarily as **ORION — ARTIST**. I would *not* package it primarily as “drawing content” or as generic timelapse/social-media material. The interesting story is that drawing is part of your current creative process and gives people access to the hand and mind behind the monumental work.\\n\\n### The package I would build\\n\\nThink of one drawing session as a **content package**, not one video.\\n\\n| Asset | Length / format | Purpose | Where |\\n|---|---:|---|---|\\n| **Hero process film** | 2–5 min, horizontal | Shows the drawing developing and establishes your current practice | **YouTube + website** |\\n| **Timelapse** | 30–90 sec | Visually satisfying complete transformation | **YouTube Shorts / Instagram / Facebook** |\\n| **Process clips** | 10–30 sec | Individual moments: mark-making, details, hands, tools, decisions | **Shorts/Reels/social** |\\n| **Finished drawing** | High-res still | Gives the work authority as an artwork rather than just content | **Website + social** |\\n| **You + drawing** | Still or short video | Connects the work to *you* | **Website/About + social** |\\n| **Detail images** | 3–6 crops | Shows texture and visual language lost in timelapse | **Website/carousel** |\\n| **Short statement** | 50–150 words | Explains why you're drawing now and its relationship to the larger practice | **Website + YouTube description** |\\n\\nThe key distinction is that **the long video is the source material; the individual posts are derivatives**. Don't make yourself invent six different pieces of content.\\n\\n### Where it belongs on orionfredericks.studio\\n\\nI would introduce a new section rather than burying these drawings among Gilly, Portal, Divinatrix, etc.\\n\\nSomething like:\\n\\n**WORK**  \\nSculpture  \\nDrawing  \\nExperiments / Studies  \\nCollaborative Work\\n\\nAnd eventually:\\n\\n**PROCESS**  \\nStudio  \\nDrawing  \\nFabrication  \\nTesting / Prototyping\\n\\nThe finished drawings belong under **Drawing**. The videos belong primarily under **Process**, with selected process video embedded into individual drawing/project pages.\\n\\nThat distinction becomes important. **Artwork is the result; process is how you got there.**\\n\\n### YouTube should be the permanent video home\\n\\nurlOrion Fredericks on YouTubehttps://www.youtube.com/@OrionFredericks should become the canonical moving-image archive.\\n\\nI wouldn't title videos generically:\\n\\n\u003e Drawing Timelapse #4\\n\\nInstead, establish a recognizable series:\\n\\n\u003e **Drawing the Numinous — No. 01 | Orion Fredericks**\\n\\nor\\n\\n\u003e **Studio Studies — No. 01 | Drawing Process**\\n\\nor simply:\\n\\n\u003e **Drawing Study 01 — Orion Fredericks**\\n\\nThe description can then connect the drawing to your broader work:\\n\\n\u003e A drawing study from the current studio practice of sculptor Orion Fredericks, exploring forms and visual relationships that recur throughout my work in sculpture, light, fire, water and kinetic installation.\\n\\nThat connection is doing important digital-footprint work. Someone finding the drawing video isn't left thinking, **“Oh, he's doing drawings now.”** They're shown that the drawings are another window into the same practice.\\n\\n### Facebook has a different job\\n\\nurlThe Art of Orion Frederickshttps://www.facebook.com/TheArtofOrionFredericks/ shouldn't necessarily receive the exact same content in the exact same form.\\n\\nThere I'd use a strong finished image or a 30–60 second transformation and a more personal caption explaining what you're doing.\\n\\nThe objective is **reconnection**:\\n\\n\u003e I've spent a lot of time drawing again lately. These studies have become a place to explore some of the same forms, tensions and spatial relationships that have run through my sculptural work for years...\\n\\nThen video.\\n\\nThat begins connecting the people who knew you from Gilly/Fata Morgana/Burning Man/Crucible/etc. with what you're doing **now**.\\n\\n### And this suggests a release sequence\\n\\nI wouldn't open the new content campaign with a 25-year retrospective.\\n\\nI'd start **present tense**.\\n\\n**Drawing → Drawing → Studio/process → Current sculpture → Historical connection → Drawing → Major archival work → Current project.**\\n\\nFor example:\\n\\n**Week 1:** Drawing process — *here is what I'm making now*  \\n**Week 2:** Another drawing + finished image  \\n**Week 3:** Studio/process footage  \\n**Week 4:** Drawing form → older sculpture that shares the visual language  \\n**Week 5:** Gilly / Fata Morgana / Portal archival story  \\n**Week 6:** New/current Numinous work\\n\\nNow the archive isn't nostalgia. It becomes **evidence of a continuous practice**.\\n\\nAnd that's the larger opportunity I see in the drawing footage: **use the quiet, intimate scale of drawing as the doorway into the enormous body of work behind it.**\\n\\nIf you upload **one representative drawing video/timelapse**, I can look at the actual footage and develop the first complete package—**edit structure, long-form title, thumbnail concept, YouTube description, short-form cut points, website placement and release sequence**—rather than designing this abstractly. memcite\",{},{\"_196\":414,\"_203\":483,\"_54\":484,\"_207\":485,\"_209\":210,\"_211\":34,\"_212\":373,\"_214\":486,\"_216\":217},\"cbc6967d-d5b9-47e2-a490-cad3cc12a391\",[401],{\"_255\":377,\"_214\":488},1790544739.740802,{\"_250\":251,\"_252\":487},{\"_386\":387,\"_375\":34,\"_388\":14,\"_229\":67,\"_232\":233,\"_235\":426,\"_237\":238,\"_239\":427,\"_241\":427,\"_242\":67,\"_66\":67,\"_244\":481,\"_245\":10,\"_243\":14},[365],{},{\"_196\":481,\"_203\":492,\"_54\":493,\"_207\":494,\"_209\":210,\"_212\":213,\"_214\":495,\"_216\":217},\"94fcd3af-c013-4a0a-a0a1-22952b34199e\",[414],{\"_255\":377,\"_214\":497},1790544738.7524166,{\"_250\":251,\"_252\":496},{\"_375\":34,\"_229\":67,\"_232\":233,\"_235\":426,\"_237\":238,\"_239\":427,\"_241\":427,\"_242\":67,\"_66\":67,\"_244\":490,\"_245\":10,\"_243\":14},[365],{},{\"_196\":490,\"_203\":501,\"_54\":502,\"_56\":503,\"_207\":504,\"_209\":210,\"_212\":213,\"_214\":505,\"_216\":217},\"220bc336-6565-46a7-a7c0-a53488641387\",[481],{\"_255\":411,\"_214\":508},1790544738.458,1790544759.21895,{\"_250\":251,\"_252\":506 ":-5,\"_816\":-5,\"_817\":-5,\"_818\":-5,\"_819\":-5,\"_820\":-5,\"_868\":-5,\"_869\":-5,\"_270\":-5,\"_53\":-5,\"_870\":-5},\"retrieval_turn\",\"retrieval_file_index\",\"cited_message_idx\",35,\"cited_message_id\",\"search_result_idx\",\"line_range\",[810,812],\"set_id\",\"spl_version\",\"effective_time\",{\"_50\":784,\"_301\":824,\"_196\":825,\"_787\":788,\"_251\":826,\"_858\":872},{\"_860\":373,\"_861\":373,\"_862\":810,\"_864\":830,\"_865\":-5,\"_866\":873,\"_790\":-5,\"_803\":804,\"_791\":827,\"_813\":-5,\"_814\":-5,\"_815\":-5,\"_816\":-5,\"_817\":-5,\"_818\":-5,\"_819\":-5,\"_820\":-5,\"_868\":-5,\"_869\":-5,\"_270\":-5,\"_53\":-5,\"_870\":-5,\"_797\":618,\"_798\":618},[831,832],{\"_50\":784,\"_301\":785,\"_196\":786,\"_787\":788,\"_251\":836,\"_858\":875},{\"_860\":373,\"_861\":213,\"_862\":863,\"_864\":807,\"_865\":-5,\"_866\":876,\"_790\":-5,\"_803\":804,\"_791\":792,\"_813\":-5,\"_814\":-5,\"_815\":-5,\"_816\":-5,\"_817\":-5,\"_818\":-5,\"_819\":-5,\"_820\":-5,\"_868\":-5,\"_869\":-5,\"_270\":-5,\"_53\":-5,\"_870\":-5},[839,840],{\"_50\":784,\"_301\":824,\"_196\":825,\"_787\":788,\"_251\":844,\"_858\":878},{\"_860\":373,\"_861\":373,\"_862\":810,\"_864\":830,\"_865\":-5,\"_866\":879,\"_790\":-5,\"_803\":804,\"_791\":827,\"_813\":-5,\"_814\":-5,\"_815\":-5,\"_816\":-5,\"_817\":-5,\"_818\":-5,\"_819\":-5,\"_820\":-5,\"_868\":-5,\"_869\":-5,\"_270\":-5,\"_53\":-5,\"_870\":-5,\"_797\":213,\"_798\":213},[847,848],[249],[882],\"Yes. I’d use this as a **gap-filling worksheet**, not a rating of the work itself. Your files already establish deep fabrication/technical experience and a long exhibition record; what is missing is consistent metadata that lets us confidently place each item into the five-part framework. fileciteturn0file0L29-L45 fileciteturn0file1L12-L30\\n\\n| Category | What we already know | Information you should add | Priority |\\n|---|---|---|---|\\n| **1. Orion — Artist** | Strong sculpture history, exhibitions, public installations | **Authorship:** Sole / Co-created / Fabrication for another artist. **Concept/story.** Year created. Current owner/location. Current status. | **HIGH** |\\n| **2. Elemental / Experiential Designer** | Fire, water, optics, kinetics, thermodynamics, interaction | For each project: **What is the experience? What does the audience do/see/feel?** Which elements: Fire / Water / Light / Sound / Kinetic / Interactive / Optical. | **HIGH** |\\n| **3. Builder / Technical Lead** | Extensive fabrication, controls, fuel systems, structural work, teaching | **Your exact role** on every collaborative project: Design / Engineering / Fabrication / Lead Fabricator / PM / Flame FX / Controls / Installation / Safety. | **VERY HIGH** |\\n| **4. Immersive / Experience Work** | Lumen \u0026 Forge, projection mapping, domes, AR/VR, branded experiences | Project names, **what you personally did**, client, dates, images/video you're permitted to show, team credits, technical challenge. | **VERY HIGH** |\\n| **5. Orion — Now** | Numinous Designs, current studio practice and existing portfolio | Current projects, commissions, works available, services offered, current studio capabilities, **what you want to be hired for now**, new work in development. | **CRITICAL** |\\n| **Career chronology** | Strong 1990s–2019 history | Better documentation for **2019–2024 transition** and 2024–26 work | **HIGH** |\\n| **Project metadata** | Many projects named | Dimensions, materials, year, location, collaborators, commissioner/client, exhibition history | **HIGH** |\\n| **Media inventory** | Spreadsheet contains links/media references | Best 5–10 photos per project, hero image, fabrication images, finished video, press-quality assets | **HIGH** |\\n| **Press / validation** | MAKE, Popular Mechanics, NYT, SF Chronicle etc. listed on resume | Exact article URL, date, project mentioned, quote/description, publication-quality image | **MEDIUM** |\\n| **Commercial availability** | Some known | Available / Sold / Permanent installation / Commissionable / Rebuildable / Archive only | **HIGH** |\\n| **Narrative importance** | Some priority ranking exists | Why each piece matters in the evolution of your practice | **MEDIUM** |\\n| **Rights / permissions** | Mostly unclear | Photographer credit, video owner, client NDA/restrictions, permission to publish | **HIGH** |\\n\\nThe biggest gaps aren't really **“what did Orion make?”** We already have quite a lot of that. The biggest gaps are **“What exactly was Orion's role?”**, **“Why does this project matter?”**, and **“Can we publish the material?”** Your resume demonstrates just how broad the technical side is—fuel/water systems, controls, kinetics, structural fabrication, machining, CNC, thermodynamics and fluid dynamics—but those capabilities aren't yet consistently connected to individual projects. fileciteturn0file0L113-L139\\n\\n### The fields I'd add to your existing inventory spreadsheet\\n\\nRather than creating a separate database, I'd extend the spreadsheet you uploaded with these columns:\\n\\n**Primary Category** | **Secondary Category** | **Authorship** | **My Role** | **Year Designed** | **Year Built** | **Client/Commissioner** | **Collaborators** | **Dimensions** | **Materials** | **Elemental Systems** | **Interactive?** | **Concept / Why It Matters** | **Current Location** | **Current Status** | **Available?** | **Best Hero Image** | **Video** | **Fabrication Documentation** | **Press/External Validation** | **Photo/Video Rights** | **Website Status** | **YouTube Status** | **Facebook Status** | **Release Priority** | **Missing Information** | **Next Action**\\n\\nAnd I would make **Primary Category** a controlled choice from:\\n\\n**ARTIST · EXPERIENCE · TECHNICAL · IMMERSIVE · NOW**\\n\\nA project can have secondary categories, but forcing one **primary identity** will keep the new website/content architecture from becoming muddy.\\n\\nFor example, *Fata Morgana* might be **ARTIST** primary / **EXPERIENCE** secondary; *Sanctuary* could be **TECHNICAL** primary / **EXPERIENCE** secondary; Lumen \u0026 Forge projects could be **IMMERSIVE** primary / **TECHNICAL** secondary; and Numo would likely be **NOW** primary with **ARTIST + EXPERIENCE + TECHNICAL** secondary classifications.\\n\\nThe older CV is particularly valuable here because it gives us dates and exhibition history for many works that can populate otherwise empty records. fileciteturn0file1L34-L75\\n\\n**The first information I'd have you fill in is not dimensions or materials.** I'd start with just four columns for every important project:\\n\\n**MY ROLE → AUTHORSHIP → WHY THIS MATTERS → CURRENT STATUS**\\n\\nOnce those four are populated, I can categorize the whole body of work much more accurately and identify exactly which pieces should lead the new content release.\",{},{\"_196\":763,\"_203\":887,\"_54\":888,\"_207\":889,\"_209\":210,\"_212\":373,\"_214\":890,\"_216\":217},\"181f8d33-4545-48e9-9df0-52c81dd8348e\",[752],{\"_255\":377,\"_214\":892},1790544050.453366,{\"_250\":251,\"_252\":891},{\"_229\":67,\"_232\":233,\"_235\":775,\"_237\":238,\"_239\":776,\"_241\":776,\"_242\":67,\"_66\":67,\"_244\":885,\"_245\":10,\"_375\":34,\"_243\":14},[365],{},{\"_196\":885,\"_203\":896,\"_54\":897,\"_207\":898,\"_209\":210,\"_212\":213,\"_214\":899,\"_216\":217},\"ba2826e2-330c-45a9-b756-394fd1f6ff20\",[763],{\"_255\":377,\"_214\":901},1790544050.556344,{\"_250\":251,\"_252\":900},{\"_375\":34,\"_229\":67,\"_232\":233,\"_235\":775,\"_237\":238,\"_239\":776,\"_241\":776,\"_242\":67,\"_66\":67,\"_244\":894,\"_245\":10,\"_243\":14},[365],{},{\"_196\":894,\"_203\":905,\"_54\":906,\"_207\":907,\"_209\":210,\"_211\":34,\"_212\":373,\"_214\":908,\"_216\":217},\"4af0854a-2122-4ecf-adad-97f86911c308\",[885],{\"_255\":377,\"_214\":910},1790544050.541061,{\"_250\":251,\"_252\":909},{\"_386\":387,\"_375\":34,\"_388\":14,\"_229\":67,\"_232\":233,\"_235\":775,\"_237\":238,\"_239\":776,\"_241\":776,\"_242\":67,\"_66\":67,\"_2 ":-5,\"_797\":213,\"_798\":213},[999,848],[249],[1026],\"Yes. These files fill in several of the biggest holes in the first-pass audit.\\n\\nThe most important correction is that your footprint shouldn't be reconstructed primarily from what Google currently finds. Your **resume/CV + site inventory establish the authoritative chronology**, and the public web becomes evidence showing which parts of that chronology are visible, missing, distorted, or outdated.\\n\\n### What the files change\\n\\nYour current resume establishes three very useful professional eras: **Orion Fredericks Studios (1999–2019)**, **Lumen \u0026 Forge (2019–2022)**, and **Numinous Designs (2024–present)**. It also documents that the middle period wasn't an artistic disappearance: at Lumen \u0026 Forge you were working in industrial design/fabrication, projection mapping, immersive environments, AR/VR, domes, and experiential projects for clients including Nike, Toyota, McLaren x Mastercard, Don Julio, and Travis Scott x Air Jordan. fileciteturn0file0L21-L45\\n\\nThat's a **major missing chapter in the public narrative**.\\n\\nYour older CV also proves that the career isn't just “Burning Man fire sculpture.” It documents a long exhibition history from the late 1990s through 2019, including Maker Faire, EDC, The Crucible, Chabot Space \u0026 Science Center, Lightning in a Bottle, private commissions and other exhibitions. fileciteturn0file1L12-L30 The public-installation history also includes *Fata Morgana*, *Passage of Awakening*, *Tapasya* and *Springwater*. fileciteturn0file1L77-L83\\n\\nAnd your resume pushes the technical history even further back: teaching metalworking at The Crucible, helping build its industrial-arts facility, fabrication for Archie Held Studios, extensive work for Michael Christian/Xian Studios, glass fabrication, foundry/furnace work, controls, fuel systems and structural fabrication. fileciteturn0file0L65-L94\\n\\n### The spreadsheet may be the most strategically important file\\n\\nIt contains roughly **70 identifiable bodies of work/projects**, rather than the handful represented prominently by the current website.\\n\\nMore importantly, you've already begun doing the curatorial work. There is a priority hierarchy:\\n\\n**Portal #1 → Gilly #2 → Divinatrix #3 → Twins #4 → Fata Morgana / Le Attrata #5 → Springwater #6 → XOD #7 → Thermokraken #8 → Skrillex #9 → M548A fire-fighting vehicle #10 → Dragonfly #11**, followed by Momentary Realization, Oracle, Opulent Temple, Sanctuary, Supafroopy, Tapasya, Willy, SCM, Harmonizer, Echevaria, Cyclone, Altar of Hang and Bike Arch.\\n\\nThat is extremely useful because I don't think the next release should attempt to publish everything equally.\\n\\nThere's also a remarkable amount of source material already catalogued: image folders, existing copy, videos, collaborators, dates, availability and third-party documentation. Projects such as *Portal, Gilly, Divinatrix, Fata Morgana, Le Attrata, Springwater, XOD,* and *Twins* already have enough material to become substantially richer digital records.\\n\\n## A clearer picture of the footprint is emerging\\n\\nI would now divide your digital identity into **five strands**, rather than treating everything as one portfolio:\\n\\n**ORION — THE ARTIST**  \\nPortal, Gilly, Divinatrix, Fata Morgana, Twins, Springwater, Tapasya, Echevaria, Momentary Realization, drawings, glass and early sculptural work.\\n\\n**ORION — THE ELEMENTAL/EXPERIENTIAL DESIGNER**  \\nFire, water, optics, thermodynamics, kinetics, sound, lighting and human interaction.\\n\\n**ORION — THE BUILDER / TECHNICAL LEAD**  \\nThe Crucible, Michael Christian projects, Sanctuary, M548A firefighting vehicle, Dragonfly, Opulent Temple, large fabrication projects, controls, rigging, structural fabrication, fuel systems.\\n\\n**ORION — IMMERSIVE / EXPERIENCE WORK**  \\nThe Lumen \u0026 Forge period: projection mapping, domes, AR/VR, experiential environments and major commercial projects. Your resume explicitly documents this expertise. fileciteturn0file0L133-L139\\n\\n**ORION — NOW**  \\nNuminous Designs, current sculpture, commissions, fabrication leadership, Numo/new work, teaching/mentorship and the next phase of the studio. Your current resume positions Numinous as a multidisciplinary studio serving public, civic, corporate and private clients. fileciteturn0file0L5-L20\\n\\nThat last strand is currently the weakest online, despite being the one that should tell people **what to do with you now**.\\n\\n### There's also an important attribution problem to solve\\n\\nYour spreadsheet identifies a substantial body of work where you participated in fabrication/design/engineering but the web's canonical page belongs to someone else—for example Michael Christian projects such as *Almost, Bike Arch, Bloom, Brainchild, Candelaphyte, Koilos, Corpus, Epod, Hypha,* and others.\\n\\nThose shouldn't simply be mixed into “Works by Orion Fredericks.”\\n\\nInstead, I'd create a clearly identified category such as:\\n\\n**Selected Collaborative \u0026 Fabrication Work**\\n\\nwith your **specific role** attached to every project.\\n\\nThat simultaneously gives you credit for decades of high-level work **without muddying authorship**.\\n\\n### And the 2020–2024 “gap” isn't really a gap\\n\\nIt's a **visibility gap**.\\n\\nThe files show a progression more like:\\n\\n**1994–1999 — Formation**  \\nGlass, ceramics, metal, Alfred, early public sculpture.\\n\\n**1999–2007 — Crucible / industrial arts**  \\nStudio building, teaching, fabrication, early fire/water experimentation.\\n\\n**2002–2010 — Elemental experimentation**  \\nThermokraken, Oracle, Twins, Springwater, Cyclone, Fata Morgana.\\n\\n**2010–2019 — Monumental practice**  \\nPortal, Gilly, XOD, Divinatrix, Le Attrata, festival/public work and extensive collaborative fabrication.\\n\\n**2019–2022 — Immersive technology**  \\nLumen \u0026 Forge, projection, domes, AR/VR and branded experiential work.\\n\\n**2023–2024 — Re-emergence / new language**  \\nDrawings, SCM, Dragonfly, Supafroopy and renewed personal work.\\n\\n**2024–present — Numinous**  \\nStudio founder, monumental sculpture, technical leadership and new work.\\n\\nThat is a considerably more interesting story than the one the internet currently tells.\\n\\n## What I think we should do next\\n\\nI would **not start releasing content yet**.\\n\\nWe now have enough information to build a proper **Digital Footprint Matrix** with one row for every meaningful project/persona and columns for:\\n\\n**Project → Year → Orion's Role → Authorship → Images → Video → Existing Website → YouTube → Facebook → Third-Party Coverage → Search Visibility → Current Copy → Priority → Action**\\n\\nThen each item gets one of four actions: **AMPLIFY, BUILD, UPDATE, or ARCHIVE**.\\n\\nThat matrix will tell us something very valuable: **which 10–15 pieces of content can most efficiently reshape the internet's understanding of Orion Fredericks before we start feeding it dozens of new posts.**\\n\\nAnd I suspect *Portal, Gilly, Divinatrix, Fata Morgana, Le Attrata, Numo/current work, the Lumen \u0026 Forge chapter, and a carefully presented “35 years of making” chronology* will form the backbone—but I'd like the audit to establish that rather than assuming it. memcite\",{},{\"_196\":932,\"_203\":1031,\"_54\":1032,\"_207\":1033,\"_209\":210,\"_211\":14,\"_212\":213,\"_214\":1034,\"_216\":217},\"a359cd69-bb65-4753-855a-770a6b7689a7\",[921],{\"_255\":256,\"_214\":1039},1790543768.012966,{\"_250\":351,\"_207\":1038},{\"_341\":342,\"_343\":839,\"_344\":1035,\"_346\":1036,\"_348\":1037,\"_232\":233,\"_234\":14,\"_235\":944,\"_237\":238,\"_239\":945,\"_241\":945,\"_229\":67,\"_242\":67,\"_66\":67,\"_243\":14,\"_244\":1029,\"_350\":34,\"_245\":10},1790543755.8971171,1790543767.9955344,\"collapse\",\"Worked for 12s\",{},{\"_196\":1029,\"_203\":1043,\"_54\":1044,\"_207\":1045,\"_209\":210,\"_211\":14,\"_212\":213,\"_214\" ew0\\n\\nThat means someone arriving cold gets a fairly clear impression of:\\n\\n**Orion Fredericks → elemental / experiential artist → monumental sculpture → fire + water + optics + kinetics.**\\n\\nThat's a strong artistic identity. What is much less visible is **Orion in 2026**: the scale of your career, your technical capabilities, fabrication/engineering leadership, current studio practice, Numinous Designs, commissioned work, creative direction, production capabilities, and what you're working toward now.\\n\\nThere are also some content/SEO issues. The homepage has no real H1 in the indexed version, several project names are abbreviated (“Fata,” “ET,” “Divi,” “Attrata”), and the project descriptions don't consistently contain the search vocabulary somebody looking for your kind of work would use. citeturn0view0turn0search13\\n\\nSo I would **preserve the artistic voice but substantially strengthen the information architecture.**\\n\\n### 2. Facebook — useful archive, but shouldn't define the new release\\n\\nurlThe Art of Orion Fredericks on Facebookhttps://www.facebook.com/TheArtofOrionFredericks/\\n\\nFacebook is throttling external access, so I can't responsibly claim I've audited every post on the page yet. Search also isn't surfacing the page particularly strongly.\\n\\nFor the content strategy, I'd therefore treat Facebook initially as an **archive/community distribution channel**, rather than the canonical source for your identity.\\n\\nThere may be years of useful historical material there that should be selectively resurfaced. The question shouldn't be “How do we restart Facebook?” so much as:\\n\\n**What valuable material exists there that should become part of the larger Orion Fredericks archive/story?**\\n\\nThat distinction will matter.\\n\\n### 3. YouTube has potentially much greater strategic value\\n\\nurlOrion Fredericks on YouTubehttps://www.youtube.com/@OrionFredericks\\n\\nDirect external crawling of the channel is also being throttled, so I don't yet have a reliable inventory of every video, title and description.\\n\\nBut YouTube should probably become a **primary pillar of the new release**, rather than merely somewhere old documentation lives.\\n\\nYour work has something photographs can't adequately communicate: **scale, sound, movement, flame, water, audience reaction, fabrication and transformation.**\\n\\nThere is also already video content elsewhere associated with your name. For example, your Vimeo documentation of *Fata Morgana* describes the optical system and the 28-foot projected light body in considerable detail. citeturn1search0\\n\\nThat suggests an opportunity to consolidate scattered moving-image documentation around the YouTube identity.\\n\\n---\\n\\n## The more interesting discovery: Google already knows an older version of Orion\\n\\nSearching your name produces a surprisingly coherent historical record.\\n\\nMAKE has a substantial 2014 profile titled *The Heavy Metal of Orion Fredericks*, describing you as a Bay Area artist best known for large-scale sculpture. citeturn0search10 Burning Man's own Journal identifies *Fata Morgana* and other projects associated with you, including your contribution to Oakland's Bike Bridge. citeturn1search8turn1search13 The Crucible still has an artist page carrying essentially the same philosophical statement that appears on your present website. citeturn0search12\\n\\nThere are also unusually valuable institutional references. Sotheby's documented **Le Attrata by Margaret Long and Orion Fredericks**, including its turbine-driven blast furnaces and sculptural concept. citeturn0search6 Chatsworth separately describes you and Margaret as artists working with sophisticated flame effects at the intersection of thermodynamics and art. citeturn1search11\\n\\nAnd entity[\\\"point_of_interest\\\",\\\"AREA15\\\",\\\"Las Vegas, NV, USA | 3215 S Rancho Dr, Las Vegas, NV 89102\\\"] currently identifies **Mini, Nilly \u0026 Hilly** as Orion Fredericks works on its public art page. citeturn1search17\\n\\nThose are strong third-party credibility signals.\\n\\nBut there's also **digital archaeology competing with your present identity**.\\n\\nAn old Weebly site is still indexed prominently and describes you as an Oakland sculpture artist, with older biographical information. citeturn0search1 Older Burning Man-era pages point toward the obsolete **orionfredericks.net** domain. citeturn1search15turn0search12 Engineered Artworks currently lists you simply as a **“Fire Technician,”** which is accurate to a particular relationship but obviously represents only a narrow slice of your overall practice. citeturn0search11\\n\\nAnd now there is another identity entering search results:\\n\\nurlNuminous Designshttps://www.numinousdesigns.com/ identifies you as **Co-Founder**, describes your Crucible/THERM background, and positions you as someone creating monumental work for more than 25 years. citeturn0search2turn1search9\\n\\nSo the current footprint roughly looks like this:\\n\\n**1999–2010**\\nOrion → fire artist / Oakland / Crucible / THERM / Burning Man / Fata Morgana.\\n\\n**2010–2020**\\nOrion → established large-scale sculptor / fire + water + kinetics / Maker Faire / festivals / collaborations / Le Attrata.\\n\\n**2020–2025**\\nThe public narrative becomes much thinner.\\n\\n**2025–2026**\\nNuminous Designs begins introducing a new identity: Orion as co-founder / senior artist / monumental fabrication practitioner.\\n\\nThat missing bridge is probably the central problem your new content release should solve.\\n\\n## I would build the audit around one question\\n\\nRather than asking simply **“What content do I have online?”**, I think we should determine:\\n\\n\u003e **What does the internet currently believe Orion Fredericks is—and what do we want it to understand five minutes after encountering the new body of content?**\\n\\nThen we can deliberately connect the **35-year arc of artist → builder → technical specialist → creative director → studio founder → mentor/educator**, without abandoning the strange elemental artistic identity that makes the work distinctive. memcite\\n\\n### Next audit pass\\n\\nI'd expand this substantially before we decide what you should release. Specifically, I'll map **Google/search results, Google Images, Vimeo, Instagram, Burning Man, MAKE, The Crucible, Maker Faire, AREA15, Sotheby's/Chatsworth, Numinous Designs, old domains/sites, interviews, press, collaborators' sites, and unattributed/misattributed project imagery**.\\n\\nThen we can sort everything into four useful buckets: **Amplify / Update / Archive / Suppress or supersede**.\\n\\nThat will give us a real **Orion Fredericks Digital Footprint Map**, and from that we can design the release sequence rather than just starting to post new material randomly.\",{\"_2197\":2198},\"real_author\",\"tool:web\",{\"_196\":1228,\"_203\":2202,\"_54\":2203,\"_207\":2204,\"_209\":210,\"_211\":14,\"_212\":213,\"_214\":2205,\"_216\":217},\"f41c60aa-7c5b-4351-bff4-c20924f141ce\",[1201],{\"_255\":256,\"_214\":2209},1790543145.554604,{\"_250\":351,\"_207\":2208},{\"_341\":342,\"_343\":963,\"_344\":2206,\"_346\":2207,\"_348\":349,\"_232\":233,\"_234\":14,\"_235\":1241,\"_237\":238,\"_239\":1242,\"_241\":1242,\"_229\":67,\"_242\":67,\"_66\":67,\"_243\":14,\"_244\":2200,\"_350\":34,\"_245\":10},1790543140.2205045,1790543145.5418036,\"Worked for 5s\",{},{\"_196\":2200,\"_203\":2213,\"_54\":2214,\"_207\":2215,\"_209\":210,\"_211\":14,\"_212\":213,\"_214\":2216,\"_216\":217},\"2fcd70e3-62d5-44ca-a9d0-3d5bb02af4b7\",[1228],{\"_255\":256,\"_214\":2392},1790543145.550778,{\"_250\":640,\"_640\":2387,\"_642\":2388},{\"_630\":2217,\"_341\":632,\"_633\":2218,\"_635\":2219,\"_344\":2206,\"_232\":233,\"_234\":14,\"_235\":1241,\"_237\":238,\"_239\":1242,\"_241\":1242,\"_229\":67,\"_242\":67,\"_66\":67,\"_243\":14,\"_244\":2220,\"_350\":34,\"_245\":10},{\"_230\":2237,\"_6
