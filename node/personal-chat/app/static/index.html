<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Chat</title>
<style>
  :root { --bg:#f7f7f5; --fg:#1d1d1b; --muted:#6b6b66; --card:#fff; --line:#e2e2dc; --accent:#2f5d50; --warn:#8a5a00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --fg:#ececea; --muted:#9a9a94; --card:#20201e; --line:#33332f; --accent:#7fb8a6; --warn:#e0b04a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; display:flex; flex-direction:column; height:100vh; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; flex:1; }
  .pill { font-size:13px; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:2px 10px; }
  .pill.warn { color:var(--warn); border-color:var(--warn); }
  main { flex:1; overflow-y:auto; padding:16px; max-width:820px; width:100%; margin:0 auto; }
  .msg { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin:0 0 10px; white-space:pre-wrap; }
  .msg.user { border-color:var(--accent); }
  .note { color:var(--muted); font-size:14px; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); max-width:820px; width:100%; margin:0 auto; }
  textarea { flex:1; resize:none; height:56px; font:inherit; padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
  button { font:inherit; border:0; border-radius:8px; padding:0 16px; background:var(--accent); color:var(--bg); cursor:pointer; }
  button.plain { background:transparent; color:var(--muted); border:1px solid var(--line); padding:2px 10px; }
</style>
</head>
<body>
<header>
  <h1>Personal Chat</h1>
  <span id="tier" class="pill">tier: checking</span>
  <span id="licence" class="pill">licence: checking</span>
  <button class="plain" id="quit" type="button">Quit</button>
</header>
<main id="log">
  <p class="note">Everything you type stays on this computer. The answers come from a model running here.</p>
</main>
<form id="f">
  <textarea id="q" placeholder="Ask anything" aria-label="Message"></textarea>
  <button type="submit">Send</button>
</form>
<script>
const log = document.getElementById('log'), q = document.getElementById('q');
const history = [];
function add(role, text) {
  const d = document.createElement('div'); d.className = 'msg ' + role; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
async function status() {
  try {
    const s = await (await fetch('/api/status')).json();
    const t = document.getElementById('tier');
    t.textContent = 'tier: ' + s.tier.tier + (s.tier.chatModel ? ' · ' + s.tier.chatModel : '');
    t.title = s.tier.note || ''; t.classList.toggle('warn', !s.tier.measured);
    const l = document.getElementById('licence');
    l.textContent = 'licence: ' + s.licence.state; l.title = s.licence.detail;
    l.classList.toggle('warn', s.licence.state !== 'licensed' && s.licence.state !== 'preview');
    if (!s.ollama.running) add('note', 'The local model server (Ollama) is not running on this computer. Install it from ollama.com, start it, then reload this page.');
    else if (s.tier.chatModel && !s.ollama.models.some(m => m === s.tier.chatModel || m === s.tier.chatModel + ':latest'))
      add('note', 'The model ' + s.tier.chatModel + ' is not downloaded yet. Run: ollama pull ' + s.tier.chatModel);
  } catch (e) { add('note', 'Could not read the app status.'); }
}
document.getElementById('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const text = q.value.trim(); if (!text) return;
  q.value = ''; add('user', text); history.push({role:'user', content:text});
  const pending = add('assistant', '…');
  try {
    const r = await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({messages: history})});
    const j = await r.json();
    if (!r.ok) { pending.textContent = j.error || 'No answer.'; history.pop(); return; }
    pending.textContent = j.reply; history.push({role:'assistant', content:j.reply});
  } catch (e) { pending.textContent = 'No answer from the app.'; history.pop(); }
});
q.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('f').requestSubmit(); } });
document.getElementById('quit').addEventListener('click', async () => {
  try { await fetch('/api/quit', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'}); } catch (e) {}
  document.body.innerHTML = '<main><p class="note">Personal Chat has stopped. You can close this tab.</p></main>';
});
status();
</script>
</body>
</html>
